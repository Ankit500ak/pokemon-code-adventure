<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6336c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="800" fill="#ffffff"/>
  <text x="30" y="34" font-size="21" font-weight="700" fill="#12233d">Pokémon Code Adventure — System Architecture</text>
  <text x="30" y="54" font-size="12" fill="#66788f">Everything runs in one browser tab except the optional localhost Code Runner · BYO-ROM · zero build step · file references are the real modules</text>

  <!-- User -->
  <rect x="470" y="66" width="220" height="34" rx="17" fill="#12233d"/>
  <text x="580" y="88" font-size="13" fill="#ffffff" text-anchor="middle">👤 Learner / Teacher</text>
  <line x1="580" y1="100" x2="580" y2="114" stroke="#495057" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Browser container -->
  <rect x="20" y="116" width="820" height="472" rx="10" fill="#f4f8ff" stroke="#4f8ff7" stroke-width="1.6"/>
  <rect x="20" y="116" width="820" height="26" rx="10" fill="#4f8ff7"/>
  <text x="36" y="134" font-size="13" font-weight="700" fill="#ffffff">BROWSER TAB — index.html · assets/styles.css · js/ (native ES modules, no bundler)</text>

  <!-- UI layer -->
  <text x="36" y="164" font-size="11.5" font-weight="700" fill="#38618f">UI LAYER — js/app.js (single-page studio, all state + wiring)</text>
  <g font-size="11" fill="#12233d">
    <rect x="36"  y="172" width="148" height="66" rx="6" fill="#e8f1fe" stroke="#4f8ff7"/>
    <text x="110" y="192" text-anchor="middle" font-weight="700">Block Library</text>
    <text x="110" y="208" text-anchor="middle">search · CRUD</text>
    <text x="110" y="222" text-anchor="middle">import / export JSON</text>
    <rect x="196" y="172" width="148" height="66" rx="6" fill="#e8f1fe" stroke="#4f8ff7"/>
    <text x="270" y="192" text-anchor="middle" font-weight="700">Workflow Canvas</text>
    <text x="270" y="208" text-anchor="middle">DOM nodes</text>
    <text x="270" y="222" text-anchor="middle">SVG wire layer</text>
    <rect x="356" y="172" width="148" height="66" rx="6" fill="#e8f1fe" stroke="#4f8ff7"/>
    <text x="430" y="192" text-anchor="middle" font-weight="700">Code Editor</text>
    <text x="430" y="208" text-anchor="middle">presets · templates</text>
    <text x="430" y="222" text-anchor="middle">route recorder · console</text>
    <rect x="516" y="172" width="148" height="66" rx="6" fill="#e8f1fe" stroke="#4f8ff7"/>
    <text x="590" y="192" text-anchor="middle" font-weight="700">Adventure Mode</text>
    <text x="590" y="208" text-anchor="middle">11 missions</text>
    <text x="590" y="222" text-anchor="middle">progress + checking</text>
    <rect x="676" y="172" width="148" height="66" rx="6" fill="#e8f1fe" stroke="#4f8ff7"/>
    <text x="750" y="192" text-anchor="middle" font-weight="700">World Views</text>
    <text x="750" y="208" text-anchor="middle">Practice canvas 2D</text>
    <text x="750" y="222" text-anchor="middle">EmulatorJS host div</text>
  </g>

  <!-- Core layer -->
  <text x="36" y="266" font-size="11.5" font-weight="700" fill="#1e6b45">CORE ENGINE — js/core/*.mjs (pure, DOM-free, unit-tested with node --test)</text>
  <g font-size="10.5" fill="#12233d">
    <rect x="36"  y="274" width="124" height="86" rx="6" fill="#e6fcf5" stroke="#2f9e6e"/>
    <text x="98" y="292" text-anchor="middle" font-weight="700">engine.mjs</text>
    <text x="98" y="308" text-anchor="middle">PracticeWorld</text>
    <text x="98" y="322" text-anchor="middle">grid · facing</text>
    <text x="98" y="336" text-anchor="middle">encounters</text>
    <text x="98" y="350" text-anchor="middle">waypoints</text>
    <rect x="168" y="274" width="124" height="86" rx="6" fill="#e6fcf5" stroke="#2f9e6e"/>
    <text x="230" y="292" text-anchor="middle" font-weight="700">runtime.mjs</text>
    <text x="230" y="308" text-anchor="middle">Game API factory</text>
    <text x="230" y="322" text-anchor="middle">action queue</text>
    <text x="230" y="336" text-anchor="middle">pause / stop gate</text>
    <text x="230" y="350" text-anchor="middle">AsyncFunction sandbox</text>
    <rect x="300" y="274" width="124" height="86" rx="6" fill="#e6fcf5" stroke="#2f9e6e"/>
    <text x="362" y="292" text-anchor="middle" font-weight="700">blocks.mjs</text>
    <text x="362" y="308" text-anchor="middle">BlockDefinition</text>
    <text x="362" y="322" text-anchor="middle">validation · params</text>
    <text x="362" y="336" text-anchor="middle">JS / Python</text>
    <text x="362" y="350" text-anchor="middle">code generation</text>
    <rect x="432" y="274" width="124" height="86" rx="6" fill="#e6fcf5" stroke="#2f9e6e"/>
    <text x="494" y="292" text-anchor="middle" font-weight="700">library.mjs</text>
    <text x="494" y="308" text-anchor="middle">20 built-in blocks</text>
    <text x="494" y="322" text-anchor="middle">group creation</text>
    <text x="494" y="336" text-anchor="middle">library</text>
    <text x="494" y="350" text-anchor="middle">import / export</text>
    <rect x="564" y="274" width="124" height="86" rx="6" fill="#e6fcf5" stroke="#2f9e6e"/>
    <text x="626" y="292" text-anchor="middle" font-weight="700">workflow.mjs</text>
    <text x="626" y="308" text-anchor="middle">graph validate</text>
    <text x="626" y="322" text-anchor="middle">flatten (groups,</text>
    <text x="626" y="336" text-anchor="middle">loops, branches)</text>
    <text x="626" y="350" text-anchor="middle">async executor</text>
    <rect x="696" y="274" width="128" height="86" rx="6" fill="#e6fcf5" stroke="#2f9e6e"/>
    <text x="760" y="292" text-anchor="middle" font-weight="700">missions · templates</text>
    <text x="760" y="308" text-anchor="middle">11 mission defs</text>
    <text x="760" y="322" text-anchor="middle">snapshot checks</text>
    <text x="760" y="336" text-anchor="middle">automation</text>
    <text x="760" y="350" text-anchor="middle">templates</text>
  </g>

  <!-- Adapters -->
  <text x="36" y="388" font-size="11.5" font-weight="700" fill="#9a5b13">RUNTIME ADAPTERS — js/*.js (browser-only bridges)</text>
  <g font-size="10.5" fill="#12233d">
    <rect x="36" y="396" width="256" height="62" rx="6" fill="#fff4e6" stroke="#e8a33d"/>
    <text x="164" y="414" text-anchor="middle" font-weight="700">pyodide-runner.js</text>
    <text x="164" y="430" text-anchor="middle">GAME_BRIDGE object → Pyodide</text>
    <text x="164" y="444" text-anchor="middle">async actions · sync perception</text>
    <rect x="308" y="396" width="256" height="62" rx="6" fill="#fff4e6" stroke="#e8a33d"/>
    <text x="436" y="414" text-anchor="middle" font-weight="700">emulator-api.js</text>
    <text x="436" y="430" text-anchor="middle">same Game API surface via</text>
    <text x="436" y="444" text-anchor="middle">keyboard dispatch · frame hashing</text>
    <rect x="580" y="396" width="244" height="62" rx="6" fill="#fff4e6" stroke="#e8a33d"/>
    <text x="702" y="414" text-anchor="middle" font-weight="700">emulator.js</text>
    <text x="702" y="430" text-anchor="middle">EmulatorJS loader config</text>
    <text x="702" y="444" text-anchor="middle">ROM file → object URL</text>
  </g>

  <!-- Persistence -->
  <rect x="36" y="478" width="788" height="86" rx="6" fill="#f3f0ff" stroke="#845ef7"/>
  <text x="52" y="500" font-size="11.5" font-weight="700" fill="#5f3dc4">PERSISTENCE — localStorage only (nothing leaves the device)</text>
  <text x="52" y="520" font-size="11" fill="#12233d">pca.library.v1 — custom block definitions · pca.workflow.v1 — canvas graph · pca.progress.v1 — completed missions</text>
  <text x="52" y="538" font-size="11" fill="#12233d">pca.code.&lt;missionId&gt; — editor draft per mission · pca.workflowRuns.v1 — run counter · pca.lastMission.v1 — resume point</text>
  <text x="52" y="556" font-size="11" fill="#66788f">Formats: pca-library (blocks JSON) · pca-project (library + workflow JSON, e.g. examples/capstone-workflow.json)</text>

  <!-- Right column: externals -->
  <rect x="872" y="150" width="268" height="100" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1.4"/>
  <text x="888" y="172" font-size="12" font-weight="700" fill="#12233d">🌐 Public CDNs (on demand only)</text>
  <text x="888" y="192" font-size="11" fill="#12233d">· EmulatorJS data + GBA core</text>
  <text x="888" y="210" font-size="11" fill="#12233d">· Pyodide v0.26.4 via jsDelivr</text>
  <text x="888" y="228" font-size="11" fill="#66788f">Practice World + JS blocks need neither.</text>
  <path d="M 872 232 H 856 V 420 H 828" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="848" y="330" font-size="10" fill="#66788f" transform="rotate(-90 848 330)" text-anchor="middle">first use downloads runtime</text>

  <rect x="872" y="266" width="268" height="92" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1.4"/>
  <text x="888" y="288" font-size="12" font-weight="700" fill="#12233d">📁 BYO-ROM — user's own .gba</text>
  <text x="888" y="308" font-size="11" fill="#12233d">Picked / dropped on the user's device,</text>
  <text x="888" y="324" font-size="11" fill="#12233d">turned into a tab-local object URL.</text>
  <text x="888" y="342" font-size="11" font-weight="700" fill="#b02318">Never uploaded · never bundled.</text>
  <path d="M 872 330 H 862 V 436 H 828" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="872" y="374" width="268" height="100" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="888" y="396" font-size="12" font-weight="700" fill="#12233d">🖥️ Desktop shell — Electron</text>
  <text x="888" y="416" font-size="11" fill="#12233d">desktop/main.cjs embeds the same static</text>
  <text x="888" y="432" font-size="11" fill="#12233d">server on 127.0.0.1 (ephemeral port) and</text>
  <text x="888" y="448" font-size="11" fill="#12233d">loads it in a BrowserWindow.</text>
  <text x="888" y="464" font-size="11" fill="#66788f">Same app — no code fork.</text>

  <!-- vertical flow arrows inside browser -->
  <line x1="430" y1="238" x2="430" y2="272" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="430" y1="360" x2="430" y2="394" stroke="#495057" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Code runner -->
  <path d="M 430 588 V 618" fill="none" stroke="#d6336c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>
  <text x="442" y="608" font-size="10.5" fill="#d6336c">C / C++ / Java / Rust / Go blocks — refused in the browser; this service is their only execution path</text>
  <rect x="20" y="622" width="660" height="112" rx="8" fill="#fff0f6" stroke="#d6336c" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="36" y="646" font-size="12.5" font-weight="700" fill="#a61e4d">🧩 Optional Local Code Runner — services/local-runner/server.mjs · http://127.0.0.1:8377 (localhost only)</text>
  <text x="36" y="668" font-size="11" fill="#12233d">POST /run {language, code, params} → source wrapped by RUNNER_LANGUAGES template (js/core/languages.mjs) → compiled/run in a temp dir, 20 s timeout</text>
  <text x="36" y="686" font-size="11" fill="#12233d">Tools: gcc · g++ · javac+java · rustc · go run — whichever the user has installed</text>
  <text x="36" y="704" font-size="11" fill="#12233d">Bridge protocol (JSON lines): program stdout  ACTION {"name":"right","args":[3]}  →  bridge stdin  RESULT {"ok":true}</text>
  <text x="36" y="722" font-size="11" font-weight="700" fill="#b02318">Reference server answers SIMULATED results — protocol/compile testing only; no live game is attached.</text>

  <!-- Dev / verify -->
  <rect x="696" y="622" width="444" height="112" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.4"/>
  <text x="712" y="646" font-size="12.5" font-weight="700" fill="#12233d">🛠️ Develop · verify · release</text>
  <text x="712" y="668" font-size="11" fill="#12233d">npm start → server.mjs zero-dependency static server (:8378)</text>
  <text x="712" y="686" font-size="11" fill="#12233d">npm test → node --test over js/core (52 tests)</text>
  <text x="712" y="704" font-size="11" fill="#12233d">npm run package:win / package:linux → release/ (Electron)</text>
  <text x="712" y="722" font-size="11" fill="#12233d">Play-test + fresh-clone evidence: docs/TEST_REPORT.md</text>

  <text x="30" y="766" font-size="11" fill="#66788f">Trust boundaries: learner JavaScript runs in a learning sandbox (globals shadowed — NOT a security boundary) · the Code Runner executes code on the user's own machine, by design · ROM, blocks, code and progress never leave the device.</text>
  <text x="30" y="784" font-size="11" fill="#66788f">Design detail: docs/SYSTEM_DESIGN.md · Block/runner contracts: docs/BLOCKS.md · Game API: docs/API.md</text>
</svg>
